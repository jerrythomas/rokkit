name: Coverage

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x

      - name: Install dependencies
        # --ignore-scripts for the same reason as publish.yml: @rokkit/themes'
        # `prepare` runs build.mjs mid-install, which reaches @rokkit/core →
        # date-fns before the workspace is fully linked. That is what broke this
        # job at v1.4.1 — the failure is a race, so it had passed for weeks
        # beforehand on the same bun version.
        run: bun install --ignore-scripts
      - name: Build theme CSS
        # @rokkit/themes is the ONLY package with a `prepare` script, so it is the
        # only thing --ignore-scripts skips. Run it explicitly now that
        # dependencies are linked.
        run: cd packages/themes && bun run build
      - name: Run code coverage
        run: bun run coverage
      - uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/lcov.info
      - name: Report results to DeepSource
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
          # Pinned release + published checksum, replacing `curl https://deepsource.io/cli | sh`.
          # Piping a remote installer straight into a shell executes whatever the
          # server returns: a compromised host, a hijacked URL — or simply an HTML
          # error page — runs on the runner with the job's secrets in scope.
          #
          # linux_amd64 matches runs-on: ubuntu-latest. Moving to an arm runner
          # means changing this asset name too.
          DS_VERSION: 0.10.1
          DS_SHA256: e415a6a53257457ef1dad900fdb39aeb991dd01c35c4be9cafa88a41f9e50b3b
        run: |
          set -euo pipefail
          curl -sSfL --proto '=https' --tlsv1.2 -o deepsource.tar.gz \
            "https://github.com/deepsourcelabs/cli/releases/download/v${DS_VERSION}/deepsource_${DS_VERSION}_linux_amd64.tar.gz"
          echo "${DS_SHA256}  deepsource.tar.gz" | sha256sum --check --strict
          tar -xzf deepsource.tar.gz deepsource
          ./deepsource report --analyzer test-coverage --key javascript --value-file ./coverage/lcov.info
