name: Check

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.x
      - name: Install dependencies
        # --ignore-scripts for the same reason as publish.yml: @rokkit/themes'
        # `prepare` runs build.mjs mid-install, which reaches @rokkit/core →
        # date-fns before the workspace is fully linked and fails. It is a race,
        # so it fails intermittently rather than always — this job happened to
        # survive it while Coverage did not.
        run: bun install --ignore-scripts
      - name: Build theme CSS
        # @rokkit/themes is the ONLY package with a `prepare` script, so it is the
        # only thing --ignore-scripts skips. apps/learn imports its dist, and
        # `bun run check` builds the apps, so it has to exist. Safe here because
        # dependencies are fully linked by now.
        run: cd packages/themes && bun run build
      # svelte-check catches .svelte type errors that `tsc --noEmit` (the
      # per-package pre-commit hook) does not — this is the gate `bun run bump`
      # runs, so surface failures in CI too.
      - name: Type + Svelte check
        run: bun run check
      - name: Lint
        run: bun run lint
